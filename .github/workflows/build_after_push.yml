name: Build, Publish Docker Image and Submit Dependencies

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"
      timezone: Europe/Vienna

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Checkout kotlin-rocket-lib
        uses: actions/checkout@v6
        with:
          repository: paulchen/kotlin-rocket-lib
          path: .ci/kotlin-rocket-lib

      - name: Verify kotlin-rocket-lib version
        run: |
          python3 - <<'PYTHON'
          import re
          from pathlib import Path

          def extract_version(path, pattern):
              matches = re.findall(pattern, Path(path).read_text(), re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f"::error::Expected exactly one version in {path}, found {len(matches)}")
              return matches[0]

          expected = extract_version(
              "bot/build.gradle.kts",
              r'^\s*implementation\("at\.rueckgr\.kotlin\.rocketbot:kotlin-rocket-lib:([^"\s]+)"\)\s*$',
          )
          actual = extract_version(
              ".ci/kotlin-rocket-lib/build.gradle.kts",
              r'^version\s*=\s*"([^"\s]+)"\s*$',
          )
          if actual != expected:
              raise SystemExit(
                  f"::error::kotlin-rocket-lib version mismatch: bot requires {expected}, "
                  f"but checked-out library declares {actual}"
              )
          print(f"kotlin-rocket-lib version matches: {actual}")
          PYTHON

      - name: Publish kotlin-rocket-lib to Maven Local
        working-directory: .ci/kotlin-rocket-lib
        run: ./gradlew --no-daemon publishToMavenLocal

      - name: Build and test bot
        run: ./gradlew --no-daemon build

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-submit
          cache-provider: basic

      - name: Prepare Docker image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "library-revision=$(git -C .ci/kotlin-rocket-lib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache: true
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            LIBRARY_GIT_REVISION=${{ steps.image.outputs.library-revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
